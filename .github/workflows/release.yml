name: Release

# 打 tag（v*）时出包：
#   1. CLI 三平台二进制（linux x86_64 / macOS arm64 + x86_64 / windows x86_64）
#   2. Tauri 桌面安装包（tauri-action，三平台矩阵）
# 产物先落成 draft release，人工检查后再发布。
#
# 注意：这份流程没有在本地跑过（需要 GitHub runner），只做了 YAML 校验。
# 第一次真跑时重点看 tauri-action 与 publish 两个 job 谁先创建 draft。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: CLI ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mcdl
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: mcdl
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: mcdl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mcdl.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 cargo 产物
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: cargo build --release
        run: cargo build --release -p mcdl --target ${{ matrix.target }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mcdl-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  tauri:
    name: Tauri 安装包（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Tauri 的 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: 安装前端依赖
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 产物
        uses: Swatinem/rust-cache@v2
        with:
          key: tauri-${{ matrix.os }}

      # tauri-action 会自己跑 tauri.conf.json 里的 beforeBuildCommand（pnpm build）。
      - name: 打包并挂到 draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: MCDL ${{ github.ref_name }}
          releaseBody: 桌面安装包与 CLI 二进制都挂在同一个 draft release 下，确认后再发布。
          releaseDraft: true
          prerelease: false

  publish:
    name: 把 CLI 二进制挂到同一个 Release
    needs: [cli]
    runs-on: ubuntu-latest
    steps:
      - name: 取回全部 CLI 产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 与 tauri job 写同一个 tag 的 draft；谁先创建都行，另一方会往上加资产。
      # 如果两个 job 同时创建撞了 422，重跑一次本 job 即可（幂等）。
      - name: 创建/更新 draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MCDL ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: artifacts/**
